
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificação concluída</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <section class="card">

            <div class="success-icon">
                <span>✓</span>
            </div>

            <div class="status">
                VERIFICAÇÃO CONCLUÍDA
            </div>

            <h1>
                Usuário verificado
            </h1>

            <p class="description">
                Sua conta Roblox foi verificada com sucesso.
                Você já pode fechar esta página e retornar ao aplicativo.
            </p>

            <div class="verified-box">

                <div class="avatar">
                    R
                </div>

                <div class="user-info">
                    <span class="label">CONTA VERIFICADA</span>
                    <strong>Usuário Roblox</strong>
                </div>

                <div class="check">
                    ✓
                </div>

            </div>

            <div class="divider"></div>

            <p class="security">
                🔒 Sua autenticação foi processada de forma segura.
            </p>

        </section>

        <footer>
            Verificação segura • OAuth 2.0
        </footer>

    </main>

</body>
</html>
